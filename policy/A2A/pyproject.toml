[build-system]
requires = ["flit_core >=3.7,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "a2a_flow_matching"
version = "0.1.0"
description = "Action-to-Action flow matching policy for RoboTwin"
requires-python = ">=3.8"
dependencies = [
    "hydra-core==1.2.0",
    "numba",
    "torchcfm",
    "einops",
    "diffusers",
    "zarr",
    "numcodecs",
    "h5py",
    "opencv-python",
    "dill",
]
