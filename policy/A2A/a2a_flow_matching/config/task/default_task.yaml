# RoboTwin task config. Both image shape and action_dim are overwritten at
# runtime by train.py: image shape from task_config/_camera_config.yml via the
# head_camera_type field, action_dim from the zarr file's meta attrs (written
# by process_data.py).

name: ${task_name}

image_shape: &image_shape [3, 256, 256]

shape_meta: &shape_meta
  obs:
    head_cam:
      shape: *image_shape
      type: rgb
    left_cam:
      shape: *image_shape
      type: rgb
    right_cam:
      shape: *image_shape
      type: rgb
    agent_pos:
      shape:
        - ${action_dim}
      type: low_dim
  action:
    shape:
      - ${action_dim}

dataset:
  _target_: a2a_flow_matching.dataset.robot_image_dataset.RobotImageDataset
  zarr_path: ./data/${task_name}-${setting}-${expert_data_num}.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  batch_size: 32
  max_train_episodes: null
